name: Check upstream designer-skills

# Weekly cross-reference of the vendored designer-skills against Julian Oczkowski's
# upstream repo. Opens (or updates) an issue when the vendored copy drifts.
# Run manually any time from the Actions tab (workflow_dispatch).

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cross-reference vendored skills against upstream
        id: check
        run: node scripts/check-upstream-skills.mjs --report report.md

      - name: Open or update drift issue
        if: steps.check.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="Upstream sync: designer-skills has changes"
          gh label create upstream-sync --color FBCA04 --description "Vendored designer-skills drift" 2>/dev/null || true
          NUM=$(gh issue list --state open --json number,title \
                  --jq ".[] | select(.title==\"$TITLE\") | .number" | head -1)
          if [ -n "$NUM" ]; then
            echo "Updating existing issue #$NUM"
            gh issue comment "$NUM" --body-file report.md
          else
            echo "Opening new issue"
            gh issue create --title "$TITLE" --body-file report.md --label upstream-sync
          fi
